<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Earth Tracker — Live Satellite Intelligence Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        :root {
            --bg: #07070d;
            --surface: #0f0f18;
            --surface-hover: #16162a;
            --border: #1e1e3e;
            --border-active: #33334d;
            --text: #e8e8f2;
            --text-secondary: #9ca3af;
            --text-muted: #6b7280;
            --accent: #22d3ee;
            --accent-dim: rgba(34, 211, 238, 0.1);
            --accent-glow: rgba(34, 211, 238, 0.3);
            --orange: #fb923c;
            --green: #4ade80;
            --red: #f87171;
            --purple: #c084fc;
            --yellow: #facc15;
            --font: 'Inter', system-ui, sans-serif;
            --font-mono: 'JetBrains Mono', monospace;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: var(--font);
            background: var(--bg);
            color: var(--text);
            overflow: hidden;
            height: 100vh;
        }

        /* ===== LAYOUT ===== */
        .app { display: flex; height: 100vh; width: 100vw; }
        
        /* ===== SIDEBAR ===== */
        .sidebar {
            width: 380px;
            background: var(--surface);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            z-index: 1000;
            transition: transform 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .sidebar.hidden { transform: translateX(-100%); position: absolute; }
        
        .sidebar-header {
            padding: 20px;
            border-bottom: 1px solid var(--border);
        }
        .sidebar-header h1 {
            font-size: 1.25rem;
            font-weight: 800;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .sidebar-header h1 span { font-size: 1.5rem; }
        .sidebar-header p {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-top: 4px;
        }
        .live-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 0.7rem;
            font-weight: 600;
            color: var(--green);
            margin-top: 8px;
            padding: 3px 10px;
            border-radius: 20px;
            background: rgba(74, 222, 128, 0.1);
            border: 1px solid rgba(74, 222, 128, 0.2);
        }
        .live-badge .pulse {
            width: 6px; height: 6px; border-radius: 50%; background: var(--green);
            animation: pulse-live 2s infinite;
        }
        @keyframes pulse-live {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(0.8); }
        }

        /* Search */
        .search-box {
            padding: 12px 20px;
            border-bottom: 1px solid var(--border);
            position: relative;
        }
        .search-box input {
            width: 100%;
            padding: 10px 14px 10px 38px;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 10px;
            color: var(--text);
            font-size: 0.9rem;
            outline: none;
            font-family: var(--font);
        }
        .search-box input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-dim); }
        .search-box input::placeholder { color: var(--text-muted); }
        .search-icon {
            position: absolute; left: 32px; top: 50%; transform: translateY(-50%);
            font-size: 0.9rem; color: var(--text-muted);
        }

        /* Filters */
        .filters {
            display: flex;
            gap: 6px;
            padding: 10px 20px;
            border-bottom: 1px solid var(--border);
            overflow-x: auto;
            scrollbar-width: none;
        }
        .filters::-webkit-scrollbar { display: none; }
        .filter-chip {
            padding: 5px 14px;
            border-radius: 20px;
            border: 1px solid var(--border);
            background: transparent;
            color: var(--text-secondary);
            font-size: 0.8rem;
            font-weight: 500;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s;
        }
        .filter-chip:hover { border-color: var(--border-active); color: var(--text); }
        .filter-chip.active {
            background: var(--accent-dim);
            border-color: var(--accent);
            color: var(--accent);
        }

        /* Sat List */
        .sat-list { flex: 1; overflow-y: auto; padding: 8px 12px; }
        .sat-group-label {
            font-size: 0.65rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--text-muted);
            padding: 12px 8px 6px;
        }
        .sat-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 14px;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.15s;
            margin-bottom: 2px;
            border: 1px solid transparent;
            position: relative;
        }
        .sat-item:hover { background: var(--surface-hover); border-color: var(--border); }
        .sat-item.active {
            background: var(--accent-dim);
            border-color: var(--accent);
        }
        .sat-item .drag-handle {
            position: absolute; right: 8px; top: 50%; transform: translateY(-50%);
            opacity: 0; color: var(--text-muted); cursor: grab;
            font-size: 0.8rem; transition: opacity 0.2s;
        }
        .sat-item:hover .drag-handle { opacity: 1; }
        .sat-icon {
            width: 40px; height: 40px; border-radius: 10px;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.2rem; flex-shrink: 0;
        }
        .sat-info { flex: 1; min-width: 0; }
        .sat-name { font-weight: 600; font-size: 0.88rem; }
        .sat-meta {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-top: 2px;
            display: flex;
            gap: 8px;
            align-items: center;
        }
        .sat-status-dot {
            width: 5px; height: 5px; border-radius: 50%;
            display: inline-block;
        }
        .sat-status-dot.online { background: var(--green); box-shadow: 0 0 6px var(--green); }
        .sat-status-dot.offline { background: var(--red); }
        .sat-actions {
            position: absolute; right: 8px; bottom: 8px;
            opacity: 0; transition: opacity 0.2s;
        }
        .sat-item:hover .sat-actions { opacity: 1; }
        .sat-actions button {
            background: none; border: none; color: var(--text-muted);
            cursor: pointer; padding: 2px 6px; font-size: 0.8rem;
        }
        .sat-actions button:hover { color: var(--text); }

        /* Context menu */
        .ctx-menu {
            position: fixed;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 6px 0;
            z-index: 9999;
            min-width: 160px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
            display: none;
        }
        .ctx-menu.visible { display: block; }
        .ctx-menu-item {
            padding: 8px 16px;
            font-size: 0.85rem;
            color: var(--text);
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .ctx-menu-item:hover { background: var(--surface-hover); }
        .ctx-menu-item.delete { color: var(--red); }
        .ctx-sep { border-top: 1px solid var(--border); margin: 4px 0; }

        /* Edit name modal */
        .modal-overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.7);
            z-index: 10000; display: none; align-items: center; justify-content: center;
        }
        .modal-overlay.visible { display: flex; }
        .modal {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 24px;
            width: 360px;
        }
        .modal h3 { margin-bottom: 16px; font-size: 1.1rem; }
        .modal input {
            width: 100%; padding: 10px 14px;
            background: var(--bg); border: 1px solid var(--border);
            border-radius: 8px; color: var(--text);
            font-size: 0.9rem; margin-bottom: 16px;
        }
        .modal input:focus { outline: none; border-color: var(--accent); }
        .modal-btns { display: flex; gap: 8px; justify-content: flex-end; }
        .modal-btns button {
            padding: 8px 16px; border-radius: 8px;
            font-size: 0.85rem; font-weight: 600; cursor: pointer;
        }
        .modal-cancel {
            background: transparent; border: 1px solid var(--border);
            color: var(--text);
        }
        .modal-save {
            background: var(--accent); border: none; color: #000;
        }

        /* ===== MAIN ===== */
        .main { flex: 1; position: relative; }
        #map { width: 100%; height: 100%; background: #0d1117; }

        /* Toggle */
        .sidebar-toggle {
            position: absolute; left: 400px; top: 16px;
            z-index: 1001; width: 40px; height: 40px;
            background: var(--surface); border: 1px solid var(--border);
            border-radius: 10px; color: var(--text);
            cursor: pointer; display: flex; align-items: center; justify-content: center;
            font-size: 1.1rem; transition: left 0.25s;
        }
        .sidebar-toggle.collapsed { left: 16px; }

        /* Top Bar */
        .top-bar {
            position: absolute; top: 16px; right: 16px;
            z-index: 500; display: flex; gap: 6px;
        }
        .top-btn {
            padding: 8px 16px; background: var(--surface);
            border: 1px solid var(--border); border-radius: 10px;
            color: var(--text-secondary); font-size: 0.8rem;
            font-weight: 600; cursor: pointer; transition: all 0.2s;
        }
        .top-btn:hover { border-color: var(--border-active); color: var(--text); }
        .top-btn.active {
            background: var(--accent-dim); border-color: var(--accent); color: var(--accent);
        }

        /* Info Panel */
        .info-panel {
            position: absolute; bottom: 16px; right: 16px;
            width: 400px; max-height: calc(100vh - 100px);
            background: var(--surface); border: 1px solid var(--border);
            border-radius: 16px; overflow: hidden; z-index: 500;
            backdrop-filter: blur(12px); display: none; flex-direction: column;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
        }
        .info-panel.visible { display: flex; }
        .info-header {
            padding: 20px; border-bottom: 1px solid var(--border);
            display: flex; align-items: start; justify-content: space-between;
            background: linear-gradient(135deg, var(--accent-dim), transparent);
        }
        .info-header-content { flex: 1; }
        .info-header h2 {
            font-size: 1.2rem; font-weight: 700;
            display: flex; align-items: center; gap: 10px;
        }
        .info-header .subtitle {
            font-size: 0.8rem; color: var(--text-muted); margin-top: 4px;
        }
        .info-close {
            background: none; border: none; color: var(--text-muted);
            font-size: 1.2rem; cursor: pointer; padding: 0 0 0 12px;
        }
        .info-body { overflow-y: auto; padding: 0; }
        .info-section {
            padding: 14px 20px;
            border-bottom: 1px solid var(--border);
        }
        .info-section:last-child { border-bottom: none; }
        .info-section-title {
            font-size: 0.65rem; font-weight: 700;
            text-transform: uppercase; letter-spacing: 0.08em;
            color: var(--text-muted); margin-bottom: 10px;
        }
        .info-grid {
            display: grid; grid-template-columns: 1fr 1fr; gap: 10px;
        }
        .info-cell {
            background: var(--bg); border-radius: 8px;
            padding: 10px 12px;
        }
        .info-cell-label {
            font-size: 0.7rem; color: var(--text-muted);
            text-transform: uppercase; letter-spacing: 0.05em;
        }
        .info-cell-value {
            font-size: 0.9rem; font-weight: 600; margin-top: 2px;
            font-family: var(--font-mono);
        }
        .info-desc {
            font-size: 0.85rem; color: var(--text-secondary);
            line-height: 1.6;
        }
        .info-notes {
            padding: 14px 20px;
        }
        .info-notes textarea {
            width: 100%; padding: 10px 12px;
            background: var(--bg); border: 1px solid var(--border);
            border-radius: 8px; color: var(--text);
            font-size: 0.85rem; resize: vertical;
            min-height: 80px; font-family: var(--font);
        }
        .info-notes textarea:focus { outline: none; border-color: var(--accent); }
        .info-tags {
            display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px;
        }
        .info-tag {
            padding: 3px 10px; border-radius: 20px;
            font-size: 0.7rem; font-weight: 600;
            background: var(--accent-dim); color: var(--accent);
            border: 1px solid var(--accent);
        }
        .info-bar {
            height: 4px; border-radius: 2px; background: var(--bg);
            margin-top: 8px; overflow: hidden;
        }
        .info-bar-fill {
            height: 100%; border-radius: 2px;
            background: linear-gradient(90deg, var(--accent), var(--purple));
        }

        /* Custom popup */
        .leaflet-popup-content-wrapper {
            background: var(--surface) !important;
            border: 1px solid var(--border) !important;
            border-radius: 12px !important;
            color: var(--text) !important;
        }
        .leaflet-popup-tip { background: var(--surface) !important; border: 1px solid var(--border) !important; }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--border-active); }

        @media (max-width: 768px) {
            .sidebar { position: absolute; height: 100%; }
            .info-panel { width: calc(100% - 32px); left: 16px; right: 16px; }
        }
    </style>
</head>
<body>
    <div class="app">
        <!-- Sidebar -->
        <div class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <h1><span>🛰️</span> Earth Tracker</h1>
                <p>Live satellite intelligence dashboard</p>
                <div class="live-badge"><div class="pulse"></div> Live Data Feed</div>
            </div>

            <div class="search-box">
                <span class="search-icon">🔍</span>
                <input type="text" id="sat-search" placeholder="Search satellites, agencies, types..." oninput="filterSats()">
            </div>

            <div class="filters" id="filters">
                <button class="filter-chip active" data-filter="all" onclick="setFilter('all')">All</button>
                <button class="filter-chip" data-filter="weather" onclick="setFilter('weather')">🌦️ Weather</button>
                <button class="filter-chip" data-filter="observation" onclick="setFilter('observation')">🌍 Observation</button>
                <button class="filter-chip" data-filter="communications" onclick="setFilter('communications')">📡 Comms</button>
                <button class="filter-chip" data-filter="science" onclick="setFilter('science')">🔭 Science</button>
                <button class="filter-chip" data-filter="active" onclick="setFilter('active')">🟢 Active</button>
            </div>

            <div class="sat-list" id="sat-list"></div>
        </div>

        <!-- Toggle -->
        <button class="sidebar-toggle" id="toggle-btn" onclick="toggleSidebar()">☰</button>

        <!-- Main -->
        <div class="main">
            <div id="map"></div>

            <div class="top-bar">
                <button class="top-btn active" id="btn-sat" onclick="setLayer('satellite')">🛰️ Satellites</button>
                <button class="top-btn" id="btn-weather" onclick="setLayer('weather')">🌤️ Weather</button>
                <button class="top-btn" id="btn-goes" onclick="setLayer('goes')">📡 GOES-16</button>
            </div>

            <!-- Info Panel -->
            <div class="info-panel" id="info-panel">
                <div class="info-header">
                    <div class="info-header-content">
                        <h2 id="info-title">Satellite Info</h2>
                        <div class="subtitle" id="info-subtitle">--</div>
                    </div>
                    <button class="info-close" onclick="closeInfo()">✕</button>
                </div>
                <div class="info-body" id="info-body"></div>
                <div class="info-notes">
                    <textarea id="info-notes" placeholder="Add your intelligence notes here..." oninput="saveNotes()"></textarea>
                </div>
            </div>
        </div>
    </div>

    <!-- Context Menu -->
    <div class="ctx-menu" id="ctx-menu">
        <div class="ctx-menu-item" onclick="ctxRename()">✏️ Rename</div>
        <div class="ctx-menu-item" onclick="ctxCopyCoords()">📋 Copy Coordinates</div>
        <div class="ctx-menu-item" onclick="ctxCenter()">🎯 Center on Map</div>
        <div class="ctx-sep"></div>
        <div class="ctx-menu-item delete" onclick="ctxDelete()">🗑️ Hide Satellite</div>
    </div>

    <!-- Rename Modal -->
    <div class="modal-overlay" id="rename-modal" onclick="closeRenameModal(event)">
        <div class="modal" onclick="event.stopPropagation()">
            <h3>Rename Satellite</h3>
            <input type="text" id="rename-input" placeholder="Enter new name...">
            <div class="modal-btns">
                <button class="modal-cancel" onclick="closeRenameModal()">Cancel</button>
                <button class="modal-save" onclick="doRename()">Save</button>
            </div>
        </div>
    </div>

                icon: '🔭', color: '#c084fc',
                coverage: 'Deep Space', resolution: '0.05 arcseconds',
                instruments: 'WFC3, ACS, STIS, COS, FGS', power: '2.8 kW solar',
                mass: '11,000 kg', dataRate: '1 Mbps', revisit: '97 min orbit'
            },
            {
                id: 'jwst', name: 'James Webb Space Telescope', displayName: 'James Webb Space Telescope',
                type: 'science', typeLabel: 'Space Telescope',
                agency: 'NASA / ESA / CSA', status: 'active',
                lat: 0, lon: 0,
                altitude: '1,500,000 km', orbit: 'L2 Lagrange Point',
                launch: '2021-12-25', lifespan: '10+ years',
                desc: 'Most powerful space telescope ever built. Observes infrared light from the first stars and galaxies formed after the Big Bang. Operates at L2 point.',
                icon: '🔭', color: '#c084fc',
                coverage: 'Deep Space / Infrared', resolution: '0.1 arcseconds',
                instruments: 'NIRCam, NIRSpec, MIRI, FGS', power: '2 kW solar',
                mass: '6,500 kg', dataRate: '28 Mbps', revisit: 'N/A (Stationary)'
            },
            {
                id: 'starlink', name: 'Starlink Constellation', displayName: 'Starlink Constellation',
                type: 'communications', typeLabel: 'Communications Network',
                agency: 'SpaceX', status: 'active',
                lat: 53, lon: -100,
                altitude: '550 km', orbit: 'Low Earth',
                launch: '2019-05-24', lifespan: '5-7 years per satellite',
                desc: 'Global satellite internet constellation with 5,000+ active satellites providing broadband internet access worldwide. Largest satellite constellation ever deployed.',
                icon: '📡', color: '#facc15',
                coverage: 'Global (latitudes ±53°)', resolution: 'N/A',
                instruments: 'Phased array antennas, laser links', power: '2-3 kW solar',
                mass: '~300 kg each', dataRate: 'Tbps combined', revisit: 'Continuous'
            }
        ];

        // Load saved names
        satellites.forEach(sat => {
            const saved = localStorage.getItem(`name-${sat.id}`);
            if (saved) sat.displayName = saved;
        });

        // ========== MAP ==========
        const map = L.map('map', {
            center: [25, 0], zoom: 2,
            zoomControl: false, attributionControl: false
        });
        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
            attribution: '&copy; CARTO',
            subdomains: 'abcd', maxZoom: 19
        }).addTo(map);
        L.control.zoom({ position: 'bottomright' }).addTo(map);

        // ========== STATE ==========
        let markers = {}, activeSat = null, currentFilter = 'all', currentLayer = 'satellite';
        let goesOverlay = null, ctxTarget = null;

        // ========== MARKERS ==========
        function initMarkers() {
            satellites.forEach(sat => {
                const marker = L.circleMarker([sat.lat, sat.lon], {
                    radius: sat.id === 'starlink' ? 14 : 12,
                    fillColor: sat.color, color: sat.color,
                    weight: 2, opacity: 0.9, fillOpacity: 0.35
                }).addTo(map);

                marker.bindPopup(`
                    <div style="min-width:200px">
                        <h3 style="margin:0 0 6px;font-size:1rem">${sat.icon} ${sat.displayName}</h3>
                        <p style="margin:0 0 4px;font-size:0.8rem;color:#9ca3af">${sat.typeLabel} — ${sat.agency}</p>
                        <p style="margin:0 0 4px;font-size:0.8rem;color:#6b7280">Orbit: ${sat.orbit}</p>
                        <p style="margin:0;font-size:0.8rem">Status: <span style="color:${sat.status==='active'?'#4ade80':'#f87171'}">${sat.status.toUpperCase()}</span></p>
                        <p style="margin:8px 0 0;font-size:0.8rem"><a href="#" onclick="showSatInfo('${sat.id}');return false;" style="color:#22d3ee">View Details →</a></p>
                    </div>
                `, { offset: [0, -10] });

                marker.on('click', () => showSatInfo(sat.id));
                markers[sat.id] = marker;
            });
        }

        // ========== SIDEBAR ==========
        function renderSatList() {
            const list = document.getElementById('sat-list');
            const search = document.getElementById('sat-search').value.toLowerCase();
            list.innerHTML = '';

            const filtered = satellites.filter(s => {
                const matchesSearch = s.displayName.toLowerCase().includes(search) ||
                    s.agency.toLowerCase().includes(search) ||
                    s.typeLabel.toLowerCase().includes(search);
                const matchesFilter = currentFilter === 'all' ||
                    (currentFilter === 'active' ? s.status === 'active' : s.type === currentFilter);
                return matchesSearch && matchesFilter;
            });

            // Group by type
            const groups = {};
            filtered.forEach(s => {
                if (!groups[s.type]) groups[s.type] = [];
                groups[s.type].push(s);
            });

            const groupLabels = {
                weather: '🌦️ Weather Satellites',
                observation: '🌍 Earth Observation',
                science: '🔭 Science & Telescopes',
                communications: '📡 Communications'
            };

            Object.entries(groups).forEach(([type, items]) => {
                const label = document.createElement('div');
                label.className = 'sat-group-label';
                label.textContent = groupLabels[type] || type;
                list.appendChild(label);

                items.forEach(sat => {
                    const item = document.createElement('div');
                    item.className = 'sat-item' + (activeSat === sat.id ? ' active' : '');
                    item.dataset.id = sat.id;
                    item.onclick = (e) => {
                        if (e.button !== 0) return;
                        map.setView([sat.lat, sat.lon], 4);
                        showSatInfo(sat.id);
                    };
                    item.oncontextmenu = (e) => showCtxMenu(e, sat.id);

                    const uptime = Math.floor(Math.random() * 99) + 1;

                    item.innerHTML = `
                        <div class="sat-icon" style="background:${sat.color}20">${sat.icon}</div>
                        <div class="sat-info">
                            <div class="sat-name">${sat.displayName}</div>
                            <div class="sat-meta">
                                <span class="sat-status-dot ${sat.status === 'active' ? 'online' : 'offline'}"></span>
                                ${sat.agency} · ${sat.orbit}
                            </div>
                        </div>
                        <div class="drag-handle">⋮⋮</div>
                        <div class="sat-actions">
                            <button onclick="event.stopPropagation();editName('${sat.id}')">✏️</button>
                        </div>
                    `;
                    list.appendChild(item);
                });
            });
        }

        function filterSats() { renderSatList(); }
        function setFilter(filter) {
            currentFilter = filter;
            document.querySelectorAll('.filter-chip').forEach(c => c.classList.toggle('active', c.dataset.filter === filter));
            renderSatList();
        }

        // ========== INFO PANEL ==========
        function showSatInfo(id) {
            const sat = satellites.find(s => s.id === id);
            if (!sat) return;
            activeSat = id;
            renderSatList();

            document.getElementById('info-panel').classList.add('visible');
            document.getElementById('info-title').innerHTML = `${sat.icon} ${sat.displayName}`;
            document.getElementById('info-subtitle').textContent = `${sat.typeLabel} · ${sat.agency}`;

            const body = document.getElementById('info-body');
            body.innerHTML = `
                <div class="info-section">
                    <div class="info-section-title">Overview</div>
                    <div class="info-desc">${sat.desc}</div>
                    <div class="info-tags">
                        <span class="info-tag">${sat.orbit}</span>
                        <span class="info-tag">${sat.coverage}</span>
                        <span class="info-tag">${sat.revisit}</span>
                    </div>
                </div>
                <div class="info-section">
                    <div class="info-section-title">Specifications</div>
                    <div class="info-grid">
                        <div class="info-cell">
                            <div class="info-cell-label">Altitude</div>
                            <div class="info-cell-value">${sat.altitude}</div>
                        </div>
                        <div class="info-cell">
                            <div class="info-cell-label">Orbit Type</div>
                            <div class="info-cell-value">${sat.orbit}</div>
                        </div>
                        <div class="info-cell">
                            <div class="info-cell-label">Launch Date</div>
                            <div class="info-cell-value">${sat.launch}</div>
                        </div>
                        <div class="info-cell">
                            <div class="info-cell-label">Lifespan</div>
                            <div class="info-cell-value">${sat.lifespan}</div>
                        </div>
                        <div class="info-cell">
                            <div class="info-cell-label">Mass</div>
                            <div class="info-cell-value">${sat.mass}</div>
                        </div>
                        <div class="info-cell">
                            <div class="info-cell-label">Power</div>
                            <div class="info-cell-value">${sat.power}</div>
                        </div>
                        <div class="info-cell">
                            <div class="info-cell-label">Data Rate</div>
                            <div class="info-cell-value">${sat.dataRate}</div>
                        </div>
                        <div class="info-cell">
                            <div class="info-cell-label">Resolution</div>
                            <div class="info-cell-value">${sat.resolution}</div>
                        </div>
                    </div>
                </div>
                <div class="info-section">
                    <div class="info-section-title">Instruments</div>
                    <div class="info-desc">${sat.instruments}</div>
                </div>
                <div class="info-section">
                    <div class="info-section-title">Position</div>
                    <div class="info-grid">
                        <div class="info-cell">
                            <div class="info-cell-label">Latitude</div>
                            <div class="info-cell-value">${sat.lat}°</div>
                        </div>
                        <div class="info-cell">
                            <div class="info-cell-label">Longitude</div>
                            <div class="info-cell-value">${sat.lon}°</div>
                        </div>
                    </div>
                </div>
            `;

            document.getElementById('info-notes').value = localStorage.getItem(`notes-${sat.id}`) || '';
        }

        function closeInfo() {
            document.getElementById('info-panel').classList.remove('visible');
            activeSat = null;
            renderSatList();
        }

        function saveNotes() {
            if (activeSat) {
                localStorage.setItem(`notes-${activeSat}`, document.getElementById('info-notes').value);
            }
        }

        // ========== CONTEXT MENU ==========
        function showCtxMenu(e, id) {
            e.preventDefault();
            ctxTarget = id;
            const menu = document.getElementById('ctx-menu');
            menu.style.left = e.clientX + 'px';
            menu.style.top = e.clientY + 'px';
            menu.classList.add('visible');
        }

        function ctxRename() {
            if (ctxTarget) editName(ctxTarget);
            hideCtxMenu();
        }
        function ctxCopyCoords() {
            if (ctxTarget) {
                const sat = satellites.find(s => s.id === ctxTarget);
                navigator.clipboard.writeText(`${sat.lat}, ${sat.lon}`);
            }
            hideCtxMenu();
        }
        function ctxCenter() {
            if (ctxTarget) {
                const sat = satellites.find(s => s.id === ctxTarget);
                map.setView([sat.lat, sat.lon], 5);
            }
            hideCtxMenu();
        }
        function ctxDelete() {
            if (ctxTarget) {
                const sat = satellites.find(s => s.id === ctxTarget);
                sat.hidden = true;
                if (markers[ctxTarget]) {
                    map.removeLayer(markers[ctxTarget]);
                    delete markers[ctxTarget];
                }
                renderSatList();
            }
            hideCtxMenu();
        }
        function hideCtxMenu() { document.getElementById('ctx-menu').classList.remove('visible'); }

        // ========== RENAME ==========
        function editName(id) {
            ctxTarget = id;
            const sat = satellites.find(s => s.id === id);
            document.getElementById('rename-input').value = sat.displayName;
            document.getElementById('rename-modal').classList.add('visible');
            document.getElementById('rename-input').focus();
        }

        function doRename() {
            if (!ctxTarget) return;
            const newName = document.getElementById('rename-input').value.trim();
            if (newName) {
                const sat = satellites.find(s => s.id === ctxTarget);
                sat.displayName = newName;
                localStorage.setItem(`name-${ctxTarget}`, newName);
                renderSatList();
                if (activeSat === ctxTarget) showSatInfo(ctxTarget);
            }
            closeRenameModal();
        }

        function closeRenameModal(e) {
            if (e && e.target !== e.currentTarget) return;
            document.getElementById('rename-modal').classList.remove('visible');
            ctxTarget = null;
        }

        document.getElementById('rename-input').addEventListener('keydown', e => {
            if (e.key === 'Enter') doRename();
            if (e.key === 'Escape') closeRenameModal();
        });

        // ========== SIDEBAR TOGGLE ==========
        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const btn = document.getElementById('toggle-btn');
            sidebar.classList.toggle('hidden');
            btn.classList.toggle('collapsed');
        }

        // ========== LAYERS ==========
        function setLayer(layer) {
            currentLayer = layer;
            document.querySelectorAll('.top-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(`btn-${layer}`).classList.add('active');

            if (goesOverlay) { map.removeLayer(goesOverlay); goesOverlay = null; }

            if (layer === 'goes') {
                goesOverlay = L.imageOverlay(
                    'https://cdn.star.nesdis.noaa.gov/GOES16/ABI/FD/GEOCOLOR/1808x1808.jpg',
                    [[-60, -160], [60, -20]], { opacity: 0.7 }
                ).addTo(map);
                map.setView([0, -90], 2);
            } else if (layer === 'weather') {
                goesOverlay = L.tileLayer(
                    'https://tile.openweathermap.org/map/clouds_new/{z}/{x}/{y}.png?appid=demo',
                    { opacity: 0.5 }
                ).addTo(map);
            }
        }

        // ========== WEATHER ==========
        async function updateWeather() {
            try {
                const res = await fetch(
                    'https://api.open-meteo.com/v1/forecast?latitude=26.0&longitude=-97.5&current=temperature_2m,relative_humidity_2m,cloud_cover,wind_speed_10m&timezone=auto'
                );
                const data = await res.json();
                const c = data.current;
                document.getElementById('w-temp').textContent = c.temperature_2m + '°C';
                document.getElementById('w-hum').textContent = c.relative_humidity_2m + '%';
                document.getElementById('w-wind').textContent = c.wind_speed_10m + ' km/h';
                document.getElementById('w-cloud').textContent = c.cloud_cover + '%';
            } catch (e) { console.log('Weather error:', e); }
        }

        // ========== GLOBAL CLICK ==========
        document.addEventListener('click', e => {
            if (!e.target.closest('.ctx-menu') && !e.target.closest('.sat-item')) {
                hideCtxMenu();
            }
        });

        // ========== INIT ==========
        initMarkers();
        renderSatList();
        updateWeather();
        setInterval(updateWeather, 300000);
    </script>
</body>
</html>
