<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Earth Tracker — Satellite Map + Weather</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        :root {
            --bg: #0a0a0f;
            --card: #111118;
            --card-hover: #161620;
            --border: #1e1e2e;
            --border-hover: #2a2a3e;
            --text: #e2e2ea;
            --text-muted: #6b6b7b;
            --accent: #00d4aa;
            --accent2: #ff6b35;
            --accent3: #818cf8;
            --green: #2ecc71;
            --red: #e74c3c;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.5;
            overflow-x: hidden;
        }

        /* Layout */
        .app {
            display: flex;
            height: 100vh;
        }

        /* Sidebar */
        .sidebar {
            width: 320px;
            background: var(--card);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            transition: transform 0.3s;
            z-index: 1000;
        }
        .sidebar.collapsed {
            transform: translateX(-100%);
            position: absolute;
        }
        .sidebar-header {
            padding: 20px;
            border-bottom: 1px solid var(--border);
        }
        .sidebar-header h1 {
            font-size: 1.1rem;
            font-weight: 800;
            background: linear-gradient(135deg, var(--accent), var(--accent2));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .sidebar-header p {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-top: 4px;
        }

        /* Search */
        .search-box {
            padding: 12px 20px;
            border-bottom: 1px solid var(--border);
        }
        .search-box input {
            width: 100%;
            padding: 10px 14px;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 10px;
            color: var(--text);
            font-size: 0.9rem;
            outline: none;
        }
        .search-box input:focus {
            border-color: var(--accent);
        }
        .search-box input::placeholder {
            color: var(--text-muted);
        }

        /* Satellite List */
        .sat-list {
            flex: 1;
            overflow-y: auto;
            padding: 8px;
        }
        .sat-item {
            padding: 14px 16px;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s;
            margin-bottom: 6px;
            border: 1px solid transparent;
        }
        .sat-item:hover {
            background: var(--card-hover);
            border-color: var(--border-hover);
        }
        .sat-item.active {
            background: var(--accent-glow);
            border-color: var(--accent);
        }
        .sat-item-header {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .sat-icon {
            width: 36px;
            height: 36px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
            background: rgba(0,212,170,0.1);
        }
        .sat-name {
            font-weight: 600;
            font-size: 0.9rem;
        }
        .sat-type {
            font-size: 0.75rem;
            color: var(--text-muted);
        }
        .sat-status {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            font-size: 0.7rem;
            margin-top: 6px;
            padding: 2px 8px;
            border-radius: 20px;
            background: rgba(46,204,113,0.1);
            color: var(--green);
        }
        .sat-status.offline {
            background: rgba(231,76,60,0.1);
            color: var(--red);
        }
        .status-dot-sm {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--green);
        }
        .status-dot-sm.offline {
            background: var(--red);
        }

        /* Weather Panel */
        .weather-panel {
            padding: 16px 20px;
            border-top: 1px solid var(--border);
        }
        .weather-panel h3 {
            font-size: 0.75rem;
            text-transform: uppercase;
            color: var(--text-muted);
            letter-spacing: 0.06em;
            margin-bottom: 12px;
        }
        .weather-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }
        .weather-cell {
            background: var(--bg);
            border-radius: 10px;
            padding: 12px;
            text-align: center;
        }
        .weather-cell-value {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--accent);
        }
        .weather-cell-label {
            font-size: 0.7rem;
            color: var(--text-muted);
            margin-top: 2px;
        }

        /* Toggle button */
        .sidebar-toggle {
            position: fixed;
            left: 340px;
            top: 20px;
            z-index: 1001;
            width: 40px;
            height: 40px;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 10px;
            color: var(--text);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            transition: left 0.3s;
        }
        .sidebar-toggle.collapsed {
            left: 20px;
        }

        /* Main content */
        .main {
            flex: 1;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* Map */
        #map {
            flex: 1;
            background: #0d1117;
        }
        .leaflet-container {
            background: #0d1117 !important;
        }

        /* Info Panel */
        .info-panel {
            position: absolute;
            bottom: 20px;
            right: 20px;
            width: 360px;
            max-height: 400px;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 20px;
            z-index: 500;
            overflow-y: auto;
            backdrop-filter: blur(10px);
            display: none;
        }
        .info-panel.visible {
            display: block;
        }
        .info-panel h2 {
            font-size: 1.1rem;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .info-close {
            position: absolute;
            top: 12px;
            right: 12px;
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 1.2rem;
        }
        .info-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid var(--border);
            font-size: 0.85rem;
        }
        .info-row:last-child {
            border-bottom: none;
        }
        .info-label {
            color: var(--text-muted);
        }
        .info-value {
            font-weight: 600;
        }
        .info-desc {
            margin-top: 12px;
            font-size: 0.85rem;
            color: var(--text-muted);
            line-height: 1.6;
        }
        .info-notes {
            margin-top: 12px;
        }
        .info-notes textarea {
            width: 100%;
            padding: 10px;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text);
            font-size: 0.85rem;
            resize: vertical;
            min-height: 60px;
        }

        /* Top Bar */
        .top-bar {
            position: absolute;
            top: 20px;
            right: 20px;
            left: auto;
            z-index: 500;
            display: flex;
            gap: 8px;
        }
        .top-btn {
            padding: 8px 16px;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 10px;
            color: var(--text);
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        .top-btn:hover {
            border-color: var(--accent);
        }
        .top-btn.active {
            background: var(--accent);
            color: #000;
            border-color: var(--accent);
        }

        /* Custom popup */
        .custom-popup {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 12px;
            color: var(--text);
            min-width: 200px;
        }
        .custom-popup h3 {
            font-size: 1rem;
            margin-bottom: 8px;
        }
        .custom-popup p {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-bottom: 4px;
        }
        .leaflet-popup-content-wrapper {
            background: var(--card) !important;
            border: 1px solid var(--border) !important;
            border-radius: 12px !important;
            color: var(--text) !important;
        }
        .leaflet-popup-tip {
            background: var(--card) !important;
            border: 1px solid var(--border) !important;
        }

        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: var(--bg);
        }
        ::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--border-hover);
        }

        @media (max-width: 768px) {
            .sidebar {
                position: absolute;
                height: 100%;
            }
            .info-panel {
                width: calc(100% - 40px);
                left: 20px;
                right: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="app">
        <!-- Sidebar -->
        <div class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <h1>🛰️ Earth Tracker</h1>
                <p>Live satellite tracking + weather</p>
            </div>

            <div class="search-box">
                <input type="text" id="sat-search" placeholder="Search satellites..." oninput="filterSats()">
            </div>

            <div class="sat-list" id="sat-list"></div>

            <div class="weather-panel">
                <h3>📍 Local Weather</h3>
                <div class="weather-grid" id="weather-grid">
                    <div class="weather-cell">
                        <div class="weather-cell-value" id="w-temp">--</div>
                        <div class="weather-cell-label">Temp</div>
                    </div>
                    <div class="weather-cell">
                        <div class="weather-cell-value" id="w-hum">--</div>
                        <div class="weather-cell-label">Humidity</div>
                    </div>
                    <div class="weather-cell">
                        <div class="weather-cell-value" id="w-wind">--</div>
                        <div class="weather-cell-label">Wind</div>
                    </div>
                    <div class="weather-cell">
                        <div class="weather-cell-value" id="w-cloud">--</div>
                        <div class="weather-cell-label">Clouds</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Toggle -->
        <button class="sidebar-toggle" id="toggle-btn" onclick="toggleSidebar()">☰</button>

        <!-- Main -->
        <div class="main">
            <div id="map"></div>

            <div class="top-bar">
                <button class="top-btn active" id="btn-sat" onclick="setLayer('satellite')">🛰️ Satellites</button>
                <button class="top-btn" id="btn-weather" onclick="setLayer('weather')">🌤️ Weather</button>
                <button class="top-btn" id="btn-goes" onclick="setLayer('goes')">📡 GOES-16</button>
            </div>

            <!-- Info Panel -->
            <div class="info-panel" id="info-panel">
                <button class="info-close" onclick="closeInfo()">✕</button>
                <h2 id="info-title">Satellite Info</h2>
                <div id="info-content"></div>
                <div class="info-notes">
                    <label style="font-size: 0.8rem; color: var(--text-muted);">Notes:</label>
                    <textarea id="info-notes" placeholder="Add your notes about this satellite..."></textarea>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ========== SATELLITE DATA ==========
        const satellites = [
            {
                id: 'goes-16',
                name: 'GOES-16',
                type: 'Weather Satellite',
                agency: 'NOAA / NASA',
                status: 'active',
                lat: 0,
                lon: -75,
                altitude: '35,786 km',
                orbit: 'Geostationary',
                launch: '2016-11-19',
                desc: 'Primary weather satellite for the Americas. Provides real-time imagery of weather patterns, hurricanes, and severe storms across North and South America.',
                icon: '🛰️',
                color: '#00d4aa'
            },
            {
                id: 'goes-18',
                name: 'GOES-18',
                type: 'Weather Satellite',
                agency: 'NOAA / NASA',
                status: 'active',
                lat: 0,
                lon: -137,
                altitude: '35,786 km',
                orbit: 'Geostationary',
                launch: '2022-03-01',
                desc: 'West coast weather satellite monitoring Pacific Ocean conditions, Alaska, and Hawaii. Backup for GOES-17.',
                icon: '🛰️',
                color: '#00d4aa'
            },
            {
                id: 'himawari-9',
                name: 'Himawari-9',
                type: 'Weather Satellite',
                agency: 'JMA (Japan)',
                status: 'active',
                lat: 0,
                lon: 140,
                altitude: '35,786 km',
                orbit: 'Geostationary',
                launch: '2016-11-02',
                desc: 'Japan\'s primary weather satellite covering East Asia, Australia, and the Pacific. Provides 10-minute full-disk imagery.',
                icon: '🛰️',
                color: '#00d4aa'
            },
            {
                id: 'meteosat-11',
                name: 'Meteosat-11',
                type: 'Weather Satellite',
                agency: 'EUMETSAT',
                status: 'active',
                lat: 0,
                lon: 0,
                altitude: '35,786 km',
                orbit: 'Geostationary',
                launch: '2015-07-15',
                desc: 'European weather satellite covering Europe, Africa, and the Atlantic Ocean. Part of the Meteosat Second Generation.',
                icon: '🛰️',
                color: '#00d4aa'
            },
            {
                id: 'landsat-9',
                name: 'Landsat-9',
                type: 'Earth Observation',
                agency: 'NASA / USGS',
                status: 'active',
                lat: 51.6,
                lon: -80,
                altitude: '705 km',
                orbit: 'Sun-synchronous',
                launch: '2021-09-27',
                desc: 'Provides high-resolution multispectral imagery for agriculture, forestry, geology, and environmental monitoring.',
                icon: '🌍',
                color: '#818cf8'
            },
            {
                id: 'sentinel-2a',
                name: 'Sentinel-2A',
                type: 'Earth Observation',
                agency: 'ESA',
                status: 'active',
                lat: -10,
                lon: 20,
                altitude: '786 km',
                orbit: 'Sun-synchronous',
                launch: '2015-06-23',
                desc: 'European optical imaging satellite for land monitoring, emergency response, and security applications.',
                icon: '🌍',
                color: '#818cf8'
            },
            {
                id: 'iss',
                name: 'ISS',
                type: 'Space Station',
                agency: 'NASA / Roscosmos / ESA / JAXA / CSA',
                status: 'active',
                lat: 51.6,
                lon: -50,
                altitude: '408 km',
                orbit: 'Low Earth',
                launch: '1998-11-20',
                desc: 'International Space Station. Largest human-made object in space. Continuously occupied since 2000.',
                icon: '🚀',
                color: '#ff6b35'
            },
            {
                id: 'hubble',
                name: 'Hubble Space Telescope',
                type: 'Space Telescope',
                agency: 'NASA / ESA',
                status: 'active',
                lat: 28.5,
                lon: -76,
                altitude: '540 km',
                orbit: 'Low Earth',
                launch: '1990-04-24',
                desc: 'Space telescope providing high-resolution optical and ultraviolet imagery of distant galaxies, nebulae, and planets.',
                icon: '🔭',
                color: '#c084fc'
            },
            {
                id: 'jwst',
                name: 'James Webb Space Telescope',
                type: 'Space Telescope',
                agency: 'NASA / ESA / CSA',
                status: 'active',
                lat: 0,
                lon: 0,
                altitude: '1,500,000 km',
                orbit: 'L2 Lagrange Point',
                launch: '2021-12-25',
                desc: 'Most powerful space telescope ever built. Observes infrared light from the first stars and galaxies formed after the Big Bang.',
                icon: '🔭',
                color: '#c084fc'
            },
            {
                id: 'starlink-constellation',
                name: 'Starlink Constellation',
                type: 'Communications',
                agency: 'SpaceX',
                status: 'active',
                lat: 53,
                lon: -100,
                altitude: '550 km',
                orbit: 'Low Earth',
                launch: '2019-05-24',
                desc: 'Global satellite internet constellation with 5,000+ active satellites providing broadband internet access worldwide.',
                icon: '📡',
                color: '#ff9f43'
            }
        ];

        // ========== MAP INIT ==========
        const map = L.map('map', {
            center: [25, 0],
            zoom: 2,
            zoomControl: false,
            attributionControl: false
        });

        // Dark tiles
        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
            attribution: '&copy; OpenStreetMap contributors &copy; CARTO',
            subdomains: 'abcd',
            maxZoom: 19
        }).addTo(map);

        L.control.zoom({ position: 'bottomright' }).addTo(map);

        // ========== MARKERS ==========
        const markers = {};
        let activeSat = null;

        function initMarkers() {
            satellites.forEach(sat => {
                const marker = L.circleMarker([sat.lat, sat.lon], {
                    radius: 10,
                    fillColor: sat.color,
                    color: sat.color,
                    weight: 2,
                    opacity: 0.8,
                    fillOpacity: 0.4
                }).addTo(map);

                const popup = L.popup({ offset: [0, -10] })
                    .setContent(`
                        <div class="custom-popup">
                            <h3>${sat.icon} ${sat.name}</h3>
                            <p>${sat.type} — ${sat.agency}</p>
                            <p>Orbit: ${sat.orbit}</p>
                            <p>Status: ${sat.status === 'active' ? '🟢 Active' : '🔴 Offline'}</p>
                            <p style="margin-top:8px"><a href="#" onclick="showSatInfo('${sat.id}'); return false;">View Details →</a></p>
                        </div>
                    `);

                marker.bindPopup(popup);
                marker.on('click', () => showSatInfo(sat.id));

                markers[sat.id] = marker;
            });
        }

        // ========== SIDEBAR LIST ==========
        function renderSatList(filter = '') {
            const list = document.getElementById('sat-list');
            list.innerHTML = '';

            satellites
                .filter(s => s.name.toLowerCase().includes(filter.toLowerCase()) ||
                         s.type.toLowerCase().includes(filter.toLowerCase()) ||
                         s.agency.toLowerCase().includes(filter.toLowerCase()))
                .forEach(sat => {
                    const item = document.createElement('div');
                    item.className = 'sat-item' + (activeSat === sat.id ? ' active' : '');
                    item.onclick = () => {
                        map.setView([sat.lat, sat.lon], 4);
                        showSatInfo(sat.id);
                    };

                    item.innerHTML = `
                        <div class="sat-item-header">
                            <div class="sat-icon" style="background: ${sat.color}20">${sat.icon}</div>
                            <div>
                                <div class="sat-name">${sat.name}</div>
                                <div class="sat-type">${sat.type} · ${sat.agency}</div>
                            </div>
                        </div>
                        <div class="sat-status ${sat.status}">
                            <span class="status-dot-sm ${sat.status}"></span>
                            ${sat.status.toUpperCase()}
                        </div>
                    `;

                    list.appendChild(item);
                });
        }

        function filterSats() {
            const val = document.getElementById('sat-search').value;
            renderSatList(val);
        }

        // ========== INFO PANEL ==========
        function showSatInfo(id) {
            const sat = satellites.find(s => s.id === id);
            if (!sat) return;

            activeSat = id;
            renderSatList(document.getElementById('sat-search').value);

            const panel = document.getElementById('info-panel');
            const content = document.getElementById('info-content');

            content.innerHTML = `
                <div class="info-row"><span class="info-label">Agency</span><span class="info-value">${sat.agency}</span></div>
                <div class="info-row"><span class="info-label">Type</span><span class="info-value">${sat.type}</span></div>
                <div class="info-row"><span class="info-label">Orbit</span><span class="info-value">${sat.orbit}</span></div>
                <div class="info-row"><span class="info-label">Altitude</span><span class="info-value">${sat.altitude}</span></div>
                <div class="info-row"><span class="info-label">Launch Date</span><span class="info-value">${sat.launch}</span></div>
                <div class="info-row"><span class="info-label">Coordinates</span><span class="info-value">${sat.lat}°, ${sat.lon}°</span></div>
                <div class="info-row"><span class="info-label">Status</span><span class="info-value" style="color:${sat.status==='active'?'var(--green)':'var(--red)'}`}>${sat.status.toUpperCase()}</span></div>
                <div class="info-desc">${sat.desc}</div>
            `;

            document.getElementById('info-title').innerHTML = `${sat.icon} ${sat.name}`;
            panel.classList.add('visible');

            // Load saved notes
            const notes = localStorage.getItem(`notes-${sat.id}`) || '';
            document.getElementById('info-notes').value = notes;
        }

        function closeInfo() {
            document.getElementById('info-panel').classList.remove('visible');
            activeSat = null;
            renderSatList(document.getElementById('sat-search').value);
        }

        // Save notes on input
        document.getElementById('info-notes').addEventListener('input', function() {
            if (activeSat) {
                localStorage.setItem(`notes-${activeSat}`, this.value);
            }
        });

        // ========== WEATHER ==========
        async function updateWeather() {
            try {
                const response = await fetch(
                    'https://api.open-meteo.com/v1/forecast?latitude=26.0&longitude=-97.5&current=temperature_2m,relative_humidity_2m,precipitation,cloud_cover,wind_speed_10m&timezone=auto'
                );
                const data = await response.json();
                const c = data.current;

                document.getElementById('w-temp').textContent = `${c.temperature_2m}°C`;
                document.getElementById('w-hum').textContent = `${c.relative_humidity_2m}%`;
                document.getElementById('w-wind').textContent = `${c.wind_speed_10m} km/h`;
                document.getElementById('w-cloud').textContent = `${c.cloud_cover}%`;
            } catch (e) {
                console.log('Weather fetch failed:', e);
            }
        }

        // ========== SIDEBAR TOGGLE ==========
        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const btn = document.getElementById('toggle-btn');
            sidebar.classList.toggle('collapsed');
            btn.classList.toggle('collapsed');
        }

        // ========== LAYER SWITCHING ==========
        let currentLayer = 'satellite';
        let goesOverlay = null;

        function setLayer(layer) {
            currentLayer = layer;

            document.querySelectorAll('.top-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(`btn-${layer}`).classList.add('active');

            // Remove GOES overlay if exists
            if (goesOverlay) {
                map.removeLayer(goesOverlay);
                goesOverlay = null;
            }

            if (layer === 'goes') {
                // Add GOES-16 imagery as overlay
                goesOverlay = L.imageOverlay(
                    'https://cdn.star.nesdis.noaa.gov/GOES16/ABI/FD/GEOCOLOR/1808x1808.jpg',
                    [[-60, -160], [60, -20]],
                    { opacity: 0.7 }
                ).addTo(map);
                map.setView([0, -90], 2);
            } else if (layer === 'weather') {
                // Add weather tile layer
                goesOverlay = L.tileLayer(
                    'https://tile.openweathermap.org/map/clouds_new/{z}/{x}/{y}.png?appid=demo',
                    { opacity: 0.6 }
                ).addTo(map);
            }
        }

        // ========== INIT ==========
        initMarkers();
        renderSatList();
        updateWeather();
        setInterval(updateWeather, 300000);
    </script>
</body>
</html>
